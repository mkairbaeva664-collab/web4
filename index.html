<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
</head>
<body class="py-5">

    <div class="container">
        <h1 class="mb-4">Simple Contact Form</h1>

        <form class="row g-3 was-validated">
            <div class="col-md-6">
                <label for="contactName" class="form-label">Name:</label><br>
                <input type="text" class="form-control" id="contactName" placeholder="John" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Name is required!</div>
            </div>
            <div class="col-md-6">
                <label for="contactEmail" class="form-label">Email:</label><br>
                <input type="email" class="form-control" id="contactEmail" placeholder="name@example.com" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Email is required!</div>
            </div>
            <div class="col-12">
                <label for="contactMessage" class="form-label">Message:</label><br>
                <textarea class="form-control" id="contactMessage" rows="4" cols="30" maxlength="200" required></textarea>
                <div id="messageHelper" class="form-text">Your message should be less than 200 symbols.</div>
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit">Submit</button>
            </div>
        </form>
    </div>

    <div class="container">
        <h1 class="mb-4 pt-5">Registration form</h1>

        <form class="row g-3 was-validated">
            <div class="col-12">
                <label for="uFirstLastName" class="form-label">First and Last Name:</label><br>
                <input type="text" class="form-control" id="uFirstLastName" placeholder="Harry Potter" required>
                <div class="valid-feedback">Correct!</div>
                <div class="invalid-feedback">Please enter your full name.</div>
            </div>
            <div class="col-12">
                <label for="uEmail" class="form-label">Email:</label>
                <input type="email" class="form-control" id="uEmail" placeholder="name@example.com" required>
                <div class="valid-feedback">Correct!</div>
                <div class="invalid-feedback">Email is required.</div>
            </div>
            <div class="col-12">
                <label for="uPassword" class="form-label">Password:</label>
                <input type="password" id="uPassword" class="form-control" required>
                <div class="valid-feedback">Acceptable</div>
                <div class="invalid-feedback">Enter your password.</div>
            </div>
            <div class="col-12">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" required>
                <div id="Helper" class="form-text">Both passwords must be the same</div>
            </div>
            <div class="col-12">
                <label class="form-label">Gender:</label><br>
                <div class="form-check">
                    <input type="radio" class="form-check-input" id="genderMale" name="gender">
                    <label class="form-check-label" for="genderMale">Male</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" id="genderFemale" name="gender">
                    <label class="form-check-label" for="genderFemale">Female</label>
                </div>
            </div>
            <div class="col-12">
                <label class="form-label">Hobbies:</label>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="option1">
                    <label class="form-check-label" for="option1">Drawing</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="option2">
                    <label class="form-check-label" for="option2">Volleyball</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="option3">
                    <label class="form-check-label" for="option3">Reading books</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="option4">
                    <label class="form-check-label" for="option4">Running</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="option5">
                    <label class="form-check-label" for="option5">Cooking</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="option6">
                    <label class="form-check-label" for="option6">Something else</label>
                </div>
            </div>
            <div class="col-12">
                <label for="country" class="form-label">Select country:</label>
                <select class="form-select" id="country">
                    <option>Kazakhstan</option>
                    <option>Russia</option>
                    <option>China</option>
                    <option>Kyrgyzstan</option>
                    <option>Ukraine</option>
                    <option>Something else</option>
                </select>
            </div>
            <div class="col-6">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
            <div class="col-6">
                <button type="reset" class="btn btn-danger">Reset</button>
            </div>
        </form>
    </div>
</body>
</html>
